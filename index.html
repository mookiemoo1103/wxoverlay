<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OBS Broadcast Stream Overlay</title>
    <!-- Video.js styling and player dependencies -->
    <link href="https://zencdn.net" rel="stylesheet" />
    <script src="https://zencdn.net"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #00ff00; /* Pure Chroma Green for OBS Filter keying */
            font-family: 'Arial', sans-serif;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            position: relative;
        }

        .sidebar {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 500px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .widget-box {
            background: linear-gradient(135deg, #0b2240 0%, #15355e 100%);
            border-left: 6px solid #cc1111;
            border-radius: 4px;
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            padding: 20px;
            overflow: hidden;
        }

        .widget-title {
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .live-tag {
            background-color: #cc1111;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.3;} 100% {opacity: 1;} }

        /* Weather UI Elements */
        .weather-main { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .temp-display { font-size: 54px; font-weight: bold; color: #ffffff; text-shadow: 2px 2px 4px rgba(0,0,0,0.4); }
        .weather-icon-box { width: 70px; height: 70px; }
        .weather-icon-box img { width: 100%; height: 100%; object-fit: contain; }
        
        .weather-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 4px;
        }
        .data-item { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 4px; }
        .data-label { color: #a0b2c6; font-weight: bold; }

        /* Zoomed Traffic Cam Layout Overlay Viewport Mask */
        .video-viewport {
            width: 100%;
            height: 250px;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            background-color: #000;
        }
        .video-zoom-container {
            width: 120%;
            height: 120%;
            position: absolute;
            top: -10%;
            left: -10%;
        }
        .video-js { width: 100% !important; height: 100% !important; }

        /* Alert Panel Structure styling */
        .alert-item {
            background: rgba(204, 17, 17, 0.15);
            border: 1px solid rgba(204, 17, 17, 0.4);
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.4;
        }
        .no-alerts { color: #5cb85c; font-style: italic; font-size: 14px; text-align: center; }

        /* Broadcast Ticker Lower Third */
        .lower-third {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 1840px;
            height: 70px;
            background: #0b2240;
            border-left: 8px solid #cc1111;
            border-radius: 4px;
            display: flex;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .ticker-header {
            background: #cc1111;
            color: #ffffff;
            font-weight: bold;
            text-transform: uppercase;
            padding: 0 25px;
            height: 100%;
            display: flex;
            align-items: center;
            font-size: 18px;
            letter-spacing: 1px;
            z-index: 10;
        }
        .ticker-wrap {
            flex-grow: 1;
            overflow: hidden;
            height: 100%;
            display: flex;
            align-items: center;
            position: relative;
        }
        .ticker-move {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: marquee 25s linear infinite;
            color: #ffffff;
            font-size: 20px;
            font-weight: 500;
        }
        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        .debug-status {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: rgba(0,0,0,0.8);
            color: #00ff00;
            font-family: monospace;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 3px;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <!-- Weather Box -->
        <div class="widget-box">
            <div class="widget-title">
                <span>Current Weather</span>
                <span style="font-size:12px; color:#a0b2c6;">Pearl River, LA</span>
            </div>
            <div class="weather-main">
                <div class="temp-display" id="w-temp">--°F</div>
                <div class="weather-icon-box">
                    <img id="w-icon" src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23fff' stroke-width='2'><circle cx='12' cy='12' r='5'/></svg>" alt="Icon">
                </div>
            </div>
            <div class="weather-grid">
                <div class="data-item"><span class="data-label">WIND</span><span id="w-wind">--</span></div>
                <div class="data-item"><span class="data-label">HUMIDITY</span><span id="w-humidity">--</span></div>
                <div class="data-item"><span class="data-label">DEW POINT</span><span id="w-dew">--</span></div>
                <div class="data-item"><span class="data-label">PRESSURE</span><span id="w-baro">--</span></div>
                <div class="data-item" style="grid-column: span 2;"><span class="data-label">VISIBILITY</span><span id="w-vis">--</span></div>
            </div>
        </div>

        <!-- Traffic Cam Carousel Layout Box -->
        <div class="widget-box">
            <div class="widget-title">
                <span id="cam-label">I-59 Near Pearl River</span>
                <span class="live-tag">LIVE CAM</span>
            </div>
            <div class="video-viewport">
                <div class="video-zoom-container">
                    <video id="traffic-player" class="video-js vjs-default-skin" muted playsinline></video>
                </div>
            </div>
        </div>

        <!-- Parish Advisory Module -->
        <div class="widget-box">
            <div class="widget-title">PARISH ADVISORIES</div>
            <div id="alerts-container">
                <div class="no-alerts">Awaiting network check...</div>
            </div>
        </div>
    </div>

    <!-- Bottom Streaming Ticker Line Layout Banner -->
    <div class="lower-third">
        <div class="ticker-header">Storm Tracker Alert</div>
        <div class="ticker-wrap">
            <div class="ticker-move" id="ticker-text">Connecting to weather stations...</div>
        </div>
    </div>

    <!-- Active Stream Debugger Element Overlay Window Log -->
    <div class="debug-status" id="debug-log">Status: Starting Engine...</div>

    <script>
        const NWS_STATION_URL = 'https://weather.gov';
        const NWS_ALERTS_URL = 'https://weather.gov'; // St. Tammany Parish
        
        const CAM_STREAMS = [
            'https://la.gov',
            'https://la.gov'
        ];
        const CAM_NAMES = [
            'I-59 Near Pearl River (Cam 1)',
            'I-59 Near Pearl River (Cam 2)'
        ];

        let currentCamIndex = 0;
        let player = null;

        function logDebug(message) {
            document.getElementById('debug-log').innerText = "Status: " + message;
            console.log(message);
        }

        // Independent, Sandboxed Weather Data Fetch Execution Loop
        async function fetchWeather() {
            logDebug("Fetching NWS Data...");
            try {
                const response = await fetch(NWS_STATION_URL, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/geo+json',
                        'User-Agent': 'OBSWeatherOverlayStreamSystem/2.0 (contact: github-stream-overlay)'
                    }
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const props = data.properties;

                const tempC = props.temperature.value;
                document.getElementById('w-temp').innerText = tempC ? `${Math.round((tempC * 9/5) + 32)}°F` : '--°F';

                const windSpeed = props.windSpeed.value;
                const windDir = props.windDirection.value;
