<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OBS Broadcast Stream Overlay</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #00ff00; /* Pure Chroma Green for OBS Filter Keying */
            font-family: 'Arial', sans-serif;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            position: relative;
        }

        .sidebar {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 500px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .widget-box {
            background: linear-gradient(135deg, #0b2240 0%, #15355e 100%);
            border-left: 6px solid #cc1111;
            border-radius: 4px;
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            padding: 20px;
            overflow: hidden;
        }

        .widget-title {
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .live-tag {
            background-color: #cc1111;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.3;} 100% {opacity: 1;} }

        /* Weather UI Grid */
        .weather-main { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .temp-display { font-size: 54px; font-weight: bold; color: #ffffff; text-shadow: 2px 2px 4px rgba(0,0,0,0.4); }
        .weather-icon-box { width: 75px; height: 75px; display: flex; align-items: center; justify-content: center; }
        
        .weather-icon-box svg { width: 100%; height: 100%; fill: none; stroke: #ffffff; stroke-width: 2; }
        .weather-icon-box img { width: 100%; height: 100%; object-fit: contain; }
        
        .weather-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 4px;
        }
        .data-item { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 4px; }
        .data-label { color: #a0b2c6; font-weight: bold; }

        /* Native Video Crop Matrix (Zoomed 20% to hide watermarks) */
        .video-viewport {
            width: 100%;
            height: 250px;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            background-color: #000;
        }
        .video-zoom-container {
            width: 120%; 
            height: 120%;
            position: absolute;
            top: -10%;
            left: -10%;
        }
        .video-zoom-container video {
            width: 100%;
            height: 100%;
            object-fit: fill;
            background-color: #000;
        }

        .alert-item {
            background: rgba(204, 17, 17, 0.15);
            border: 1px solid rgba(204, 17, 17, 0.4);
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.4;
        }
        .no-alerts { color: #5cb85c; font-style: italic; font-size: 14px; text-align: center; }

        /* Bottom Ticker Track */
        .lower-third {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 1840px;
            height: 70px;
            background: #0b2240;
            border-left: 8px solid #cc1111;
            border-radius: 4px;
            display: flex;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .ticker-header {
            background: #cc1111;
            color: #ffffff;
            font-weight: bold;
            text-transform: uppercase;
            padding: 0 25px;
            height: 100%;
            display: flex;
            align-items: center;
            font-size: 18px;
            letter-spacing: 1px;
            z-index: 10;
        }
        .ticker-wrap {
            flex-grow: 1;
            overflow: hidden;
            height: 100%;
            display: flex;
            align-items: center;
            position: relative;
        }
        .ticker-move {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: marquee 35s linear infinite;
            color: #ffffff;
            font-size: 20px;
            font-weight: 500;
        }
        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        .debug-status {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: rgba(0,0,0,0.8);
            color: #00ff00;
            font-family: monospace;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 3px;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <!-- Weather Container Grid -->
        <div class="widget-box">
            <div class="widget-title">
                <span>Current Weather</span>
                <span style="font-size:12px; color:#a0b2c6;">Pearl River, LA</span>
            </div>
            <div class="weather-main">
                <div class="temp-display" id="w-temp">--°F</div>
                <div class="weather-icon-box" id="w-icon-frame">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 18.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                </div>
            </div>
            <div class="weather-grid">
                <div class="data-item"><span class="data-label">WIND</span><span id="w-wind">--</span></div>
                <div class="data-item"><span class="data-label">HUMIDITY</span><span id="w-humidity">--</span></div>
                <div class="data-item"><span class="data-label">DEW POINT</span><span id="w-dew">--</span></div>
                <div class="data-item"><span class="data-label">PRESSURE</span><span id="w-baro">--</span></div>
                <div class="data-item" style="grid-column: span 2;"><span class="data-label">VISIBILITY</span><span id="w-vis">--</span></div>
            </div>
        </div>

        <!-- Native Live Cam Loop Box -->
        <div class="widget-box">
            <div class="widget-title">
                <span id="cam-label">I-59 Near Pearl River</span>
                <span class="live-tag">LIVE CAM</span>
            </div>
            <div class="video-viewport">
                <div class="video-zoom-container">
                    <!-- Native HTML5 video player configured perfectly for OBS Chromium processing -->
                    <video id="native-video-player" autoplay muted playsinline></video>
                </div>
            </div>
        </div>

        <!-- Parish Advisory Widget Box -->
        <div class="widget-box">
            <div class="widget-title">PARISH ADVISORIES</div>
            <div id="alerts-container">
                <div class="no-alerts">Syncing advisory data...</div>
            </div>
        </div>
    </div>

    <!-- Scrolling Lower-Third Ribbon -->
    <div class="lower-third">
        <div class="ticker-header">Storm Tracker Alert</div>
        <div class="ticker-wrap">
            <div class="ticker-move" id="ticker-text">Syncing directly with local reporting stations...</div>
        </div>
    </div>

    <div class="debug-status" id="debug-log">Status: Native Engine Live</div>

    <script>
        const NWS_STATION_URL = 'https://weather.gov';
        const NWS_ALERTS_URL = 'https://weather.gov'; 

        // Raw .m3u8 stream hooks passed directly to native player channels
        const CAM_URLS = [
            'https://itsstreamingno.dotd.la.gov/public/ns-cam-026.streams/playlist.m3u8',
            'https://itsstreamingno.dotd.la.gov/public/ns-cam-016.streams/chunklist_w1695320120.m3u8'
        ];
        const CAM_NAMES = [
            'I-59 Near Pearl River (Cam 1)',
            'I-59 Near Pearl River (Cam 2)'
        ];

        let currentCamIndex = 0;

        function logDebug(message) {
            document.getElementById('debug-log').innerText = "Status: " + message;
        }

        async function fetchWeather() {
            try {
                const response = await fetch(NWS_STATION_URL, {
                    headers: { 'Accept': 'application/geo+json', 'User-Agent': 'OBSWeatherOverlaySystem/6.0' }
                });
                if (response.ok) {
                    const data = await response.json();
                    const props = data.properties;

                    if(props.temperature.value !== null) document.getElementById('w-temp').innerText = Math.round((props.temperature.value * 9/5) + 32) + "°F";
                    if(props.relativeHumidity.value !== null) document.getElementById('w-humidity').innerText = Math.round(props.relativeHumidity.value) + "%";
                    if(props.windSpeed.value !== null) {
                        document.getElementById('w-wind').innerText = Math.round(props.windSpeed.value * 0.621) + " MPH";
                    } else {
                        document.getElementById('w-wind').innerText = "Calm";
